services:
  teams-captions:
    image: python:3.12-alpine
    container_name: teams-captions
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["python", "-u", "/app/server.py"]
    environment:
      GROQ_API_KEY_FILE: /data/private/groq_api_key
      GROQ_MODEL: whisper-large-v3
      TEAMSCC_WEB_ORIGIN: ${TEAMSCC_WEB_ORIGIN:-}
    ports:
      - "${TEAMSCC_BIND_ADDRESS:-127.0.0.1}:${TEAMSCC_HOST_PORT:-8765}:8765"
    volumes:
      - ./app:/app:ro
      - ./data:/data
      - ./secrets/token:/run/secrets/teams_token:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3); assert r.status == 200 and json.load(r).get('status') == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
